<div
  *ngIf="visible"
  class="toast"
  [class.success]="type === 'success'"
  [class.error]="type === 'error'"
  [class.info]="type === 'info'"
>
  <span class="toast-icon">
    {{ type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ' }}
  </span>

  <span class="toast-message">
    {{ message }}
  </span>

  <button
    class="close-button"
    (click)="close()"
  >
    X
  </button>
</div>
